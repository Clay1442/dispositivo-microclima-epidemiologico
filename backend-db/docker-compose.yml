version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_local
    ports:
      - "8086:8086" # Porta de acesso ao painel e API
    volumes:
      - influxdb_storage:/var/lib/influxdb2 # Para não perder os dados ao desligar
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=senha_mestra_123 # Mude se desejar
      - DOCKER_INFLUXDB_INIT_ORG=projeto_iot
      - DOCKER_INFLUXDB_INIT_BUCKET=microclima_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=meu_token_secreto_123

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_local
    ports:
      - "1883:1883"   # MQTT padrão
      - "9001:9001"   # WebSockets (opcional)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana_local
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    depends_on:
      - influxdb

  dashboard:
    image: nginx:alpine
    container_name: dashboard_sava
    ports:
      - "8080:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html:ro
    depends_on:
      - influxdb

volumes:
  influxdb_storage:
  mosquitto_data:
  mosquitto_log:
  grafana_storage:
version: '3.8'

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb_local
    ports:
      - "8086:8086"
    volumes:
      - influxdb_storage:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto_local
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana_local
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    depends_on:
      - influxdb

  dashboard:
    image: nginx:alpine
    container_name: dashboard_sava
    ports:
      - "8080:80"
    volumes:
      - ../dashboard:/usr/share/nginx/html
    env_file:
      - ../.env
    command: >
      sh -c "printf 'window.SAVA_CONFIG={\"influxUrl\":\"%s\",\"influxToken\":\"%s\",\"influxOrg\":\"%s\",\"influxBucket\":\"%s\"};\n'
      \"$$INFLUX_URL\" \"$$INFLUX_TOKEN\" \"$$INFLUX_ORG\" \"$$INFLUX_BUCKET\"
      > /usr/share/nginx/html/js/config.js
      && nginx -g 'daemon off;'"
    depends_on:
      - influxdb

volumes:
  influxdb_storage:
  mosquitto_data:
  mosquitto_log:
  grafana_storage:
